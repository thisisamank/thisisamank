on:
  schedule:
    - cron: '0 */12 * * *'
  push:
    branches:
      - master
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Generate README.md
      env:
        GH_TOKEN: ${{ secrets.USER_TOKEN }}
        U: thisisamank
      run: |
        created=$(gh api users/$U --jq .created_at)
        export YEARS=$(( ($(date +%s) - $(date -d "$created" +%s)) / 31557600 ))
        export COMMITS=$(gh api "search/commits?q=author:$U&per_page=1" --jq .total_count)
        export PRS=$(gh api "search/issues?q=author:$U+type:pr+-user:$U&per_page=1" --jq .total_count)
        export CONTRIBUTED=$(gh api graphql -f query='{viewer{repositoriesContributedTo{totalCount}}}' --jq .data.viewer.repositoriesContributedTo.totalCount)
        stars=$(gh api --paginate "users/$U/repos?type=owner&per_page=100" --jq '.[] | select(.fork | not) | .stargazers_count')
        export REPOS=$(echo "$stars" | wc -l)
        export STARS=$(echo "$stars" | paste -sd+ | bc)
        envsubst < TEMPLATE.md > README.md
    - name: Commit README.md
      run: |
        if [[ -n "$(git status --porcelain)" ]]; then
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -am "Update README"
          git push
        fi
